seed: 42
use_gpu: true

data:
  dataset_name: mnist
  data_dir: ./data
  num_clients: 10
  num_test_clients: 10
  batch_size: 64
  num_workers: 4
  pin_memory: true
  input_size: 224
  verbose: false
  imagenet_style: true
  data_split: iid
  seed: 42
  augmentations:
    horizontal_flip:
      enabled: true
      prob: 0.5
    random_rotation:
      enabled: true
      degrees: 20
    random_resized_crop:
      enabled: true
      scale_min: 0.4
    color_jitter:
      enabled: true
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.1
    random_erasing:
      enabled: true
      prob: 0.3
    mixup:
      enabled: false
      alpha: 0.2
      prob: 0.5
    cutmix:
      enabled: false
      alpha: 1.0
      prob: 0.5

model:
  model_name: bit_s_r50x1
  num_classes: 10
  pretrained: true
  freeze_backbone: true
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.1

training:
  epochs: 3
  lr: 0.0001
  momentum: 0.9
  weight_decay: 0.001
  scheduler: cosine
  warmup_epochs: 0
  label_smoothing: 0.1
  gradient_clip: 1.0
  optimizer: sgd

federated:
  num_rounds: 100
  num_clients: 10
  client_fraction: 1.0
  aggregation_method: fedsa
  checkpoint_freq: 25
  exclude_bn_from_agg: true

privacy:
  enable_privacy: false
  epsilon: 8.0
  delta: 1.0e-05
  max_grad_norm: 0.5
  noise_multiplier: 1.0
  target: lora_A
  use_opacus_accounting: true
evaluation:
  eval_freq: 5
  metric: accuracy
  save_best_model: true


experiment:
  name: BiT_MNIST_AttackEval
  output_dir: experiments/bit_mnist_attack_eval

privacy_attacks:
  membership_inference:
    enabled: true
    attack_batch_size: 64           # DataLoader側のバッチサイズ。このままでOK
    max_member_batches: 200         # ★ ここを増やす：200〜500程度
    max_nonmember_batches: 200      # ★ 同上
    method: threshold
    shadow:
      lr: 0.01                      # 少し小さめでも良い（0.01〜0.05あたり）
      train_steps: 800              # 200〜1000くらい。計算資源と相談
      batch_size: 64                # サンプル数が多くなるので64〜128程度
      weight_decay: 1e-4            # わずかに正則化を入れてもよい
      feature_set: [delta_l2, delta_abs_mean]  # まずはこのまま
      feature_update_lr: 0.1
      feature_update_steps: 1       # 必要なら3まで増やす
      normalize: true
  gradient_leakage:
    enabled: false
    attack_mode: trajectory
    trajectory_rounds: 4
    trajectory_min_rounds: 2
    trajectory_only: false
    optimization_steps: 400
    attack_lr: 0.25
    max_layers: 4
    optimize_labels: true
    l2_regularizer: 1.0e-4
    max_seconds: 12.0
